<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px system-ui;background:#f7f7f5;color:#222;margin:0}main{max-width:760px;margin:48px auto;padding:24px}h1{font-size:34px}section{padding:24px 0;border-top:1px solid #ccc}.controls{display:flex;gap:8px;align-items:center;margin:12px 0 20px;flex-wrap:wrap}button{padding:10px 18px;background:white;border:1px solid #aaa;border-radius:6px}.dimensions{display:flex;gap:12px;flex-wrap:wrap}.token{padding:12px;background:#eee}.row{color:#17694b}.column{color:#765319}.channel{color:#4d58ac}.output{margin-top:16px}canvas{width:100%;height:120px;background:#eee}</style></head><body><main><p>LESSON 01</p><h1>Attention: follow a token</h1><p>Watch a token attend to useful context, one step at a time.</p><section><h2>Explore attention</h2><p>Advance the sequence and compare the scores.</p><div class="controls"><button id="play">Play</button><button id="step">Step</button><button id="reset">Reset</button><label>Speed <select id="speed"><option>1×</option><option>2×</option></select></label></div><div class="dimensions"><span class="token row">Query · row</span><span class="token column">Key · column</span><span class="token channel">Value · channel</span></div><div class="output"><strong>Attention output</strong><p id="value">Step 0 — ready</p></div></section><section><h2>What changed?</h2><p>Describe the score that became most important.</p></section></main><script>let n=0,timer;const value=document.querySelector('#value');function tick(){value.textContent='Step '+(++n)+' — inspecting attention'}document.querySelector('#step').onclick=tick;document.querySelector('#play').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='Play'}else{timer=setInterval(tick,700);e.target.textContent='Pause'}};document.querySelector('#reset').onclick=()=>{n=0;value.textContent='Step 0 — ready'};</script></body></html>
